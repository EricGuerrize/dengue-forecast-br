[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dengue-forecast"
version = "0.1.0"
description = "Plataforma de vigilância epidemiológica: previsão de dengue por município (Brasil / Mato Grosso)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
  { name = "Eric Guerrize", email = "ericguerrize@users.noreply.github.com" },
]
keywords = ["dengue", "epidemiology", "data-engineering", "duckdb", "brazil"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "httpx>=0.27",
  "tenacity>=8.2",
  "pandas>=2.2",
  "pyarrow>=15.0",
  "duckdb>=1.0",
  "pandera>=0.20",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "matplotlib>=3.8",
  "structlog>=24.1",
]

[project.optional-dependencies]
sinan = [
  "pysus>=0.14",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "pre-commit>=3.7",
  "types-requests>=2.31",
]

[project.scripts]
dfc = "dengue_forecast.cli:app"

[project.urls]
Homepage = "https://github.com/EricGuerrize/dengue-forecast-br"
Repository = "https://github.com/EricGuerrize/dengue-forecast-br"

[tool.hatch.build.targets.wheel]
packages = ["src/dengue_forecast"]

[tool.hatch.build.targets.wheel.force-include]
"src/dengue_forecast" = "dengue_forecast"

[tool.hatch.build.targets.sdist]
include = ["src/dengue_forecast", "README.md", "LICENSE", "data/sample"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["dengue_forecast"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
  "integration: hits external networks (deselected by default in CI unit job)",
]

[tool.coverage.run]
source = ["dengue_forecast"]
branch = true
